# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Redeploys once a day so the visitor globe's data stays current even when
  # nothing has been pushed.
  schedule:
    - cron: "17 4 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# contents: write (rather than read) so the geocode cache can be committed back.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Regenerates data/visitor-globe.json for the homepage globe. Auth is a
      # share token rather than an API key, because API keys need Umami Cloud's
      # Pro plan while share URLs work on the free tier. The slug is held as a
      # secret only because anyone holding it can read the full public
      # dashboard; it is not needed to keep the analytics working.
      # Deliberately non-fatal: if the secret is missing or Umami is down, the
      # previous JSON ships unchanged and the site still deploys.
      - name: Refresh visitor globe data
        continue-on-error: true
        env:
          UMAMI_SHARE_SLUG: ${{ secrets.UMAMI_SHARE_SLUG }}
          # Region must match the account. A mismatch returns empty results
          # rather than an error, so it is pinned explicitly.
          UMAMI_REGION: us
          # Public by design — it ships in index.html so the tracker can
          # identify the site. Used here only to catch a share slug pasted
          # from the wrong website.
          UMAMI_WEBSITE_ID: 905a7464-541f-4519-bbab-347c7be4f8e0
        run: node scripts/build-visitor-globe.mjs
      # Only the geocode cache is committed. visitor-globe.json is left as a
      # build artifact: it is fully derived and regenerated every run, so
      # committing it would churn the history for no benefit. Pushes made with
      # GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Persist geocode cache
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geo-cache.json
          git diff --staged --quiet || {
            git commit -m "Update visitor globe geocode cache"
            git push
          }
      # enablement: true points the repo's Pages source at GitHub Actions if it
      # is not already. It was deploying from the main branch, which is why this
      # workflow's artifact never reached the live site: a branch deploy ignores
      # uploaded artifacts entirely. Doing it here means the switch and the first
      # successful Actions deploy land in the same run, leaving no window where
      # the site is unpublished. Reversible via Settings -> Pages -> Source.
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
